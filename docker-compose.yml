# SurrealDB exited the stack in MIM-88 — the tenant store is SQLite on
# the /data volume. The old surrealdb-data named volume is NOT deleted by
# removing the service definition; keep it around until the export
# scripts (export-projects / import-replica) have run and MIM-92 signs
# off the cutover.
services:
  mimir:
    image: ghcr.io/rageltd/mimir-server:next
    restart: unless-stopped
    ports:
      - "${MIMIR_PORT:-8080}:8080"
    networks:
      - caddy
      - mimir
    env_file:
      - .env
    volumes:
      - ./packages/server/system-prompt.md:/app/system-prompt.md:ro
      - ./logs:/data
    labels:
      caddy: http://mimir.conhost.lan
      caddy.reverse_proxy: "192.168.1.160:8080"

networks:
  caddy:
    external: true
  mimir:
    driver: bridge
