id = "coding/dependencies-pyproject-toml"
body = "./dependencies.md"
enabled = true
event = "file"
message = "Direct edit to pyproject.toml dependency section — use `uv add`/`uv remove` (see paired rule)."

[[conditions]]
field = "file_path"
operator = "regex_match"
pattern = '''(^|/)pyproject\.toml$'''

[[conditions]]
field = "new_text"
operator = "regex_match"
pattern = '''\[(?:tool\.poetry\.dependencies|project\.dependencies|tool\.uv\.sources)\]'''
