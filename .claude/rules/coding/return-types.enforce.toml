id = "coding/return-types"
body = "./return-types.md"
enabled = true
# The `): T =>` shape has legitimate exceptions (type predicates, contract
# types) the regex can't tell apart — advise rather than block.
severity = "nudge"
event = "file"
exclude_globs = ["*.d.ts", "*.test.*", "*.spec.*"]

[[conditions]]
field = "new_text"
operator = "regex_match"
pattern = '''\)\s*:\s*(?:\{[^}]*\}|\[[^\]]*\]|[A-Za-z_][\w<>\s,|&[\]?{}()]*?)\s*(?:=>|\{)'''
