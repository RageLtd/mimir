name: oc-plugin Release

# Auto-versioned release for packages/oc-plugin, driven by conventional
# commits — no manual tagging. On a push to main that touches the
# package, the shared scripts/release-package.sh analyzes commits, bumps
# the version in package.json, commits chore(release), and tags
# oc-plugin/v<version>. The publish job then builds the bundle, renames the
# package for its npm scope, `bun publish`es to GitHub Packages, and creates
# a GitHub Release on the new tag.
#
# The conventional-commit rules are shared with the cc/codex plugin
# workflows — feat!:/BREAKING CHANGE → major, feat: → minor,
# fix|refactor|perf|revert|build: → patch, docs:|chore:|test:|style:|ci:
# → no release. See scripts/release-package.sh for the details.
#
# To cut a release: commit changes to packages/oc-plugin/ with
# conventional-commit messages (feat:, fix:, etc.) and land them on main.
#
# To publish the first release (no prior tag), the package.json
# `version` field needs to be at the initial version (0.1.0) and the
# workflow's version-bump job will create the initial tag without a
# version bump.
#
# The work happens here on the forge; what it produces is published on
# GitHub. So the release commit and tag are pushed to both, and these
# repository secrets are needed:
#   GH_RELEASE_TOKEN    a GitHub token that may write contents (and
#                       workflows) on the GitHub repository named in GH_REPO
#   GH_PACKAGES_TOKEN   a GitHub token that may write packages
#
# Nothing is published from any branch but main. A run requested on another
# branch tests, analyzes and builds, then stops: a rehearsal.
on:
  push:
    branches: [main]
    paths:
      - "packages/oc-plugin/**"
      # The published bundle compiles plugin-core in, so core changes must
      # release this package too. release-package.sh scans the same two paths.
      - "packages/plugin-core/**"
  workflow_dispatch:

# One run of this workflow at a time, and never cancel a release halfway (the
# forge's default for a push would). Per-workflow, NOT a group shared across
# the plugin releases: a plugin-core change starts all three, and they must
# all proceed. The push step below handles the resulting concurrent bumps.
concurrency:
  group: mimir-release-oc-plugin
  cancel-in-progress: false

env:
  GH_REPO: RageLtd/mimir
  PKG: oc-plugin
  MANIFEST: packages/oc-plugin/package.json

jobs:
  test:
    name: Test
    uses: ./.forgejo/workflows/test.yml

  version-bump:
    name: Analyze & Bump Version
    needs: [test]
    runs-on: docker
    container:
      image: git.rageltd.ca/rageltd/ci-node:wolfi
    outputs:
      should_release: ${{ steps.dry-run.outputs.should_release }}
      new_version: ${{ steps.dry-run.outputs.new_version }}
    steps:
      # Full history and every tag: the script finds the last release tag and
      # reads the commits since. Left on the branch itself so it can be pushed.
      - name: Check out
        run: |
          git init -q .
          git remote add origin \
            "$(echo "$GITHUB_SERVER_URL" | sed "s#://#://token:${{ github.token }}@#")/$GITHUB_REPOSITORY.git"
          git fetch -q --tags origin "$GITHUB_REF"
          git checkout -q -B "$GITHUB_REF_NAME" FETCH_HEAD
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.git.rageltd.ca"

      - name: Analyze commits (dry run)
        id: dry-run
        run: |
          OUTPUT=$(sh scripts/release-package.sh "$PKG" "$MANIFEST" --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Nothing to do"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(echo "$OUTPUT" | grep "Version:" | sed 's/.*→ //' | tr -d '[:space:]')
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag
        if: steps.dry-run.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
        run: sh scripts/release-package.sh "$PKG" "$MANIFEST"

      - name: Push to the forge
        if: steps.dry-run.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
        # The checkout pinned the trigger commit; another plugin's bump job
        # may have already landed its release commit on main. Rebase ours on
        # top (disjoint files — release commits only touch their own package's
        # manifest) so the push fast-forwards.
        #
        # Retried because the releases run concurrently: pull-then-push is not
        # atomic, so a sibling can land between our rebase and our push and
        # take the fast-forward. Re-rebasing onto the new tip resolves it.
        # Fails loudly after three attempts rather than skipping the release
        # silently.
        #
        # A push made with the job's own token starts no workflow, so the
        # release commit does not set this one off again.
        run: |
          for attempt in 1 2 3; do
            git pull -q --rebase origin main
            if git push --follow-tags origin main; then
              exit 0
            fi
            echo "push attempt ${attempt} lost the race; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Push to GitHub
        if: steps.dry-run.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
        # The release is created on this tag on GitHub, so the commit and tag
        # must be there first; the forge's push mirror may not have run yet.
        # The token goes through a credential helper so that it is never part
        # of a URL or a command line.
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_RELEASE_TOKEN" ]; then
            echo "GH_RELEASE_TOKEN is not set, so the release cannot reach GitHub." >&2
            exit 1
          fi
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_RELEASE_TOKEN"; }; f' \
              push --follow-tags "https://github.com/${GH_REPO}.git" main

  publish:
    name: Build & Publish
    runs-on: docker
    container:
      image: git.rageltd.ca/rageltd/ci-node:wolfi
    needs: [version-bump]
    # On main, only when there is something to release. Anywhere else, always:
    # the build is the part of a rehearsal worth having.
    if: needs.version-bump.outputs.should_release == 'true' || github.ref != 'refs/heads/main'
    env:
      NEW_VERSION: ${{ needs.version-bump.outputs.new_version }}
    steps:
      # On main, build exactly what was tagged. Elsewhere, the ref the run
      # was requested on.
      - name: Check out
        run: |
          echo "version from the bump job: ${NEW_VERSION:-none}"
          ref="$GITHUB_REF"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            ref="refs/tags/${PKG}/v${NEW_VERSION}"
          fi
          git init -q .
          git remote add origin \
            "$(echo "$GITHUB_SERVER_URL" | sed "s#://#://token:${{ github.token }}@#")/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --filter @mimir/oc-plugin build

      - name: Verify bundle
        run: |
          BUNDLE="packages/oc-plugin/dist/mimir-oc.ts"
          test -f "$BUNDLE" || (echo "Bundle missing: $BUNDLE" && exit 1)
          SIZE=$(wc -c < "$BUNDLE")
          echo "Bundle size: $SIZE bytes"
          # Bundles smaller than 10KB almost certainly mean the build
          # silently emitted an empty file. The plugins have grown to
          # ~330KB and would only shrink if a major refactor pulled
          # out most of the code — this is a tripwire, not a real
          # quality gate.
          if [ "$SIZE" -lt 10240 ]; then
            echo "Bundle suspiciously small ($SIZE bytes) — failing"
            exit 1
          fi

      - name: Update package.json for publish
        if: github.ref == 'refs/heads/main'
        working-directory: packages/oc-plugin
        run: |
          # Edits before `bun publish`, all via jq (it handles the `/` in the
          # scoped names that a sed s/// delimiter chokes on):
          # 1. Rename @mimir/oc-plugin → the publish target @RageLtd/mimir-oc.
          #    The in-monorepo name stays @mimir/oc-plugin for the workspace
          #    filter and cc-plugin naming consistency; only the published
          #    artifact uses the public scope.
          # 2. Belt-and-braces version, in case the checkout is not the
          #    bumped manifest.
          # 3. Strip `private: true`. `bun publish` (like npm) refuses a
          #    package marked private; the in-repo manifest stays private for
          #    the workspace, so we only del it on this throwaway CI checkout.
          # 4. Strip devDependencies. The published artifact is the single
          #    self-contained dist/mimir-oc.ts bundle (files: ["dist"]) —
          #    plugin-core is inlined by `bun build` and @opencode-ai/* are
          #    type-only (erased). It has zero runtime deps, and leaving the
          #    `workspace:*` plugin-core devDep makes `bun publish` fail
          #    ("Failed to resolve workspace version").
          jq --arg v "$NEW_VERSION" \
            '.name = "@RageLtd/mimir-oc" | .version = $v | del(.private) | del(.devDependencies)' \
            package.json > package.json.tmp
          mv package.json.tmp package.json
          jq '{name, version, private, devDependencies}' package.json

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main'
        working-directory: packages/oc-plugin
        # `bun publish` authenticates via NPM_CONFIG_TOKEN, NOT NODE_AUTH_TOKEN
        # (npm's var). See Bun docs: https://bun.sh/docs/pm/cli/publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "GH_PACKAGES_TOKEN is not set, so the package cannot be published." >&2
            exit 1
          fi
          bun publish --registry https://npm.pkg.github.com

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        # --verify-tag: fail if the tag did not reach GitHub, instead of
        # letting GitHub invent one on whatever its main happens to be.
        run: |
          TAG="${PKG}/v${NEW_VERSION}"
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
