name: codex-plugin Release

# Auto-versioned release for packages/codex-plugin, driven by conventional
# commits — no manual tagging. On a push to main that touches the package,
# release-package.sh analyzes commits, bumps .codex-plugin/plugin.json,
# commits chore(release), and tags codex-plugin/v<version>. The release job
# then builds the binaries and publishes a GitHub Release on that tag.
# Unlike cc-plugin there is no marketplace-notify step: the codex bootstrap
# plugin is served straight from this repo via `codex plugin marketplace add`.
on:
  push:
    branches: [main]
    paths:
      - "packages/codex-plugin/**"
      # The shipped binary bundles plugin-core, so core changes must release
      # this package too. release-package.sh scans the same two paths.
      - "packages/plugin-core/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version-bump:
    name: Analyze & Bump Version
    needs: [test]
    runs-on: ubuntu-latest
    # Serialized across the plugin release workflows (shared group with
    # cc-plugin-release.yml): one push can fire both, and concurrent
    # chore(release) pushes to main would race to a non-fast-forward failure.
    # Per-workflow, NOT a shared group. A group shared across the plugin
    # releases serialised them, but GitHub holds only ONE pending run per
    # group — a third contender is cancelled outright. Since a plugin-core
    # change matches all three releases' paths filters, that starved
    # codex-plugin for a week. Independent groups let all three proceed; the
    # push step below handles the resulting concurrent bumps.
    concurrency:
      group: mimir-release-${{ github.workflow }}
    # Avoid the release commit re-triggering the workflow.
    if: "!startsWith(github.event.head_commit.message, 'chore(release): codex-plugin')"
    outputs:
      should_release: ${{ steps.dry-run.outputs.should_release }}
      new_version: ${{ steps.dry-run.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Analyze commits (dry run)
        id: dry-run
        run: |
          OUTPUT=$(sh scripts/release-package.sh codex-plugin packages/codex-plugin/.codex-plugin/plugin.json --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Nothing to do"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(echo "$OUTPUT" | grep "Version:" | sed 's/.*→ //' | tr -d '[:space:]')
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag
        if: steps.dry-run.outputs.should_release == 'true'
        run: sh scripts/release-package.sh codex-plugin packages/codex-plugin/.codex-plugin/plugin.json

      - name: Push changes and tags
        if: steps.dry-run.outputs.should_release == 'true'
        # Checkout pinned the trigger SHA; another plugin's bump job may have
        # already landed its release commit on main. Rebase ours on top
        # (disjoint files — release commits only touch their own package's
        # manifest) so the push fast-forwards.
        #
        # Retried because the releases now run concurrently: pull-then-push is
        # not atomic, so a sibling can land between our rebase and our push and
        # take the fast-forward. Re-rebasing onto the new tip resolves it. Fails
        # loudly after three attempts rather than skipping the release silently.
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push --follow-tags; then
              exit 0
            fi
            echo "push attempt ${attempt} lost the race; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: [version-bump]
    if: needs.version-bump.outputs.should_release == 'true'
    env:
      NEW_VERSION: ${{ needs.version-bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest (release commit + tag)
        run: git pull origin main --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fresh runner — without this, `bun build` can't resolve the
      # @mimir/plugin-core workspace imports the CLI bundles.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build.sh cross-compiles darwin-arm64 + linux-x64 from this Linux
      # runner and skips its codesign step off-Darwin; ensure-binary.sh
      # re-signs on the user's Mac after download. No macOS runner or signing
      # secrets needed here.
      - name: Build binaries
        working-directory: packages/codex-plugin
        run: ./build.sh

      - name: Stage release assets
        working-directory: packages/codex-plugin
        run: |
          cp dist/darwin-arm64/mimir-codex-bin mimir-codex-bin-darwin-arm64
          cp dist/linux-x64/mimir-codex-bin mimir-codex-bin-linux-x64

      - name: Publish GitHub Release
        working-directory: packages/codex-plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "codex-plugin/v${NEW_VERSION}" \
            mimir-codex-bin-darwin-arm64 \
            mimir-codex-bin-linux-x64 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "codex-plugin v${NEW_VERSION}" \
            --generate-notes
