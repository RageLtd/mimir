name: Test

# Shared test suite. Runs the full root harness (tests/run-tests.ts, which
# spawns each *.test.ts file in isolation across all packages). Reusable via
# workflow_call so the publish workflows can gate on it — a red suite blocks
# both the cc-plugin release and the server image push. Also runs on PRs to
# main for normal CI. No standalone push:main trigger, so a main push that
# triggers a publish doesn't run the suite twice.
on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test
