name: server Image (:next)

# Rolling pre-release image for packages/server. While we're in
# late-alpha/early-beta there are no semver tags — every push to main that
# touches the server (or the workspace manifests its Docker build depends on)
# rebuilds and republishes the moving `:next` tag, plus an immutable
# `sha-<short>` tag for rollback/traceability. Publishes to GHCR using the
# built-in GITHUB_TOKEN, so the image stays private alongside the repo with no
# extra secret.
on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "package.json"
      - "bun.lock"
  # Note: this workflow is deliberately NOT in its own paths filter — editing the
  # build definition shouldn't republish an unchanged image. Use workflow_dispatch
  # to rebuild on demand after a build-definition change.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rageltd/mimir-server

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build-push:
    name: Build & Push
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=next
            type=sha,format=short

      # Build context is the monorepo root — the Dockerfile copies the root
      # manifest + bun.lock + member package.json files to resolve the
      # `catalog:` dependency graph before compiling the server binary.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
